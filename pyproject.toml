[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-hydrology"
version = "0.1.0.dev0"
description = "无当地测流条件下的跨河流水位预测研究开发版"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "torch>=2.8,<2.9", "xarray>=2024.6", "netCDF4>=1.7", "h5netcdf>=1.3", "h5py>=3.11",
  "pyarrow>=17", "PyYAML>=6", "requests>=2.32", "py7zr>=1",
  "geopandas>=1", "torch-geometric>=2.8,<3", "nflows>=0.14,<1",
  "matplotlib>=3.9", "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
spatial = ["rasterio>=1.4,<2", "filelock>=3.13,<4"]

[project.scripts]
echo = "echo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
